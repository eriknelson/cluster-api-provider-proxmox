workflow:
  rules:
    - if: '$RELEASE == "true" && $CI_COMMIT_BRANCH == "main"'
    - if: '$RELEASE == "true"'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - prepare
  - validate
  - build
  - release

variables:
  HARBOR_REGISTRY: harbor.secnet.nsk.io
  IMAGE: harbor.secnet.nsk.io/capmox/capmox
  BUILDKIT_ADDR: tcp://titan-buildkitd.secnet.nsk.io:1234
  NODE_IMAGE: harbor.secnet.nsk.io/dockerhub/library/node:22-bookworm-slim
  GO_IMAGE: harbor.secnet.nsk.io/dockerhub/library/golang:1.26.6
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/gomod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/gobuild"

default:
  tags:
    - titan-docker

.go:
  image: $GO_IMAGE
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/gomod
      - .cache/gobuild
      - .cache/tools
      - bin
  before_script:
    - apt-get update -qq && apt-get install -y -qq git make

lint:
  extends: .go
  stage: validate
  script:
    - make lint

verify-versions:
  extends: .go
  stage: validate
  script:
    - GOBIN="$CI_PROJECT_DIR/.cache/tools" go install github.com/mikefarah/yq/v4@v4.53.3
    - PATH="$CI_PROJECT_DIR/.cache/tools:$PATH" make verify-versions

test:
  extends: .go
  stage: validate
  script:
    - make test WHAT='./...'

test:release:
  stage: validate
  image: $NODE_IMAGE
  script:
    - node --test hack/release.test.mjs

determine-version:
  stage: prepare
  image: $NODE_IMAGE
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  rules:
    - if: '$RELEASE == "true"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq git ca-certificates
  script:
    - node hack/release.mjs version > version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env

build:image:
  stage: build
  image: harbor.secnet.nsk.io/dockerhub/library/docker:27-cli
  needs:
    - lint
    - verify-versions
    - test
    - test:release
    - job: determine-version
      optional: true
  script:
    - |
      set -eu
      docker buildx create --name titan-remote --driver remote "$BUILDKIT_ADDR" --use
      if [ "${RELEASE:-}" = "true" ]; then
        test -n "${VERSION:-}" || { echo 'Missing release version'; exit 1; }
        echo "$HARBOR_PASS" | docker login "$HARBOR_REGISTRY" -u "$HARBOR_USER" --password-stdin
        docker buildx build --push --platform linux/amd64,linux/arm64 \
          --tag "${IMAGE}:${VERSION}" .
      else
        docker buildx build --platform linux/amd64 \
          --tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}" .
      fi

publish-release:
  stage: release
  image: $NODE_IMAGE
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  rules:
    - if: '$RELEASE == "true"'
  needs:
    - determine-version
    - build:image
  before_script:
    - apt-get update -qq && apt-get install -y -qq git ca-certificates
  script:
    - node hack/release.mjs publish
